name: mutfunc
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - xgboost
  - lightgbm
  - matplotlib
  - seaborn
  - statsmodels
  - jupyterlab
  - pyarrow            # parquet
  - tqdm
  - pyyaml
  - requests
  # Bioinformatics utilities
  - pysam              # VCF/BAM
  - bioconda::pybigwig
  - pip:
      - shap           # Model interpretation
      - myvariant      # variant annotation API
